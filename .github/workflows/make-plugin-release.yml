name: Creates a release when a plugin is updated

on:
  push:
    branches:
      - trunk

jobs:
  make-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get plugin version from header file
        id: get_plugin_version
        run: echo "VERSION=$(grep "Version:" ${{ github.event.repository.name }}.php | awk '{print $3}')" >> "$GITHUB_OUTPUT"

      - name: Zip folder
        run: zip -r ${{ github.event.repository.name }}.zip . -x "node_modules/*" ".gitignore" ".editorconfig" ".phpcs.xml" "composer.json" "composer.lock" "package.json" "package-lock.json"

      - name: Create release
        id: create_github_release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ github.event.repository.name }}.zip
          tag_name: v${{ steps.get_plugin_version.outputs.VERSION }}
          generate_release_notes: true
          make_latest: true

permissions:
  contents: write
